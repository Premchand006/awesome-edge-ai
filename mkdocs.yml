# Website build for https://premchand006.github.io/awesome-edge-ai/
# The Markdown in this repo is the single source of truth: CI copies it into
# _site_src/ (see .github/workflows/pages.yml) and renders it with MkDocs Material.
site_name: Edge AI Field Guide
site_url: https://premchand006.github.io/awesome-edge-ai/
site_description: >-
  A beginner-to-advanced roadmap for Edge AI and TinyML: model optimization
  (quantization, pruning, distillation), inference runtimes (ONNX Runtime,
  LiteRT, TensorRT, OpenVINO), real-time pipelines, edge MLOps, and runnable
  sample projects for Jetson, Raspberry Pi + Hailo, and CPU.
site_author: Prem Chand
repo_url: https://github.com/Premchand006/awesome-edge-ai
repo_name: Premchand006/awesome-edge-ai
edit_uri: edit/main/
copyright: Prose CC BY 4.0 · Code MIT
docs_dir: _site_src
not_in_nav: |
  CODE_OF_CONDUCT.md

theme:
  name: material
  custom_dir: .github/site/overrides
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search

hooks:
  - .github/site/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: README.md
  - Roadmap: roadmap/README.md
  - "Phase 0–1 · Foundations & TinyML": foundations/README.md
  - "Phase 2 · Model Structures": model-structures/README.md
  - "Phase 3 · Model Optimization": model-optimization/README.md
  - "Phase 4 · Runtimes & Frameworks": runtimes-and-frameworks/README.md
  - "Phase 5 · Real-Time Pipelines": pipelines/README.md
  - "Phase 6 · Deployment & MLOps": deployment-and-mlops/README.md
  - "Phase 7 · PoCs & Use Cases": poc-and-use-cases/README.md
  - Sample Projects:
      - sample-projects/README.md
      - sample-projects/onnxruntime-image-classification.md
      - sample-projects/pi5-hailo-live-detection.md
      - sample-projects/jetson-yolo-detection.md
  - Courses & Books: courses-and-books/README.md
  - Awesome Resources: awesome-resources/README.md
  - Verifications: VERIFICATIONS.md
  - Contributing: CONTRIBUTING.md
  - Changelog: CHANGELOG.md
